<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Darshan | Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/184104337">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    padding: 20px 0;
}

.bg-skeleton{
    position:fixed;
    inset:0;
    background:#dfe3ea;
    animation:pulse 1.6s infinite;
    z-index:-2;
}

.bg-image{
    position:fixed;
    inset:0;
    background:url("./img/start.png") center/cover no-repeat;
    opacity:0;
    transition:opacity 1.2s ease;
    z-index:-1;
}

.bg-image.show{
    opacity:1;
}

@keyframes pulse{
    0%,100%{opacity:.6;}
    50%{opacity:1;}
}

.container{
    position:relative;
    background:white;
    padding:50px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    max-width:700px;
    width:90%;
    overflow:hidden;
}

.skeleton{
    position:absolute;
    inset:0;
    padding:50px;
    transition:opacity .7s ease;
}

.skeleton.hide{
    opacity:0;
    pointer-events:none;
}

.skeleton div{
    background:#e5e7eb;
    border-radius:6px;
    margin-bottom:15px;
    animation:pulse 1.4s infinite;
}

.title{height:28px;width:70%;}
.text{height:14px;width:100%;}
.short{width:60%;}
.btn-skel{height:35px;width:120px;}

.content{
    opacity:0;
    transform:scale(.96) translateY(10px);
    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.22,1,.36,1);
}

.content.show{
    opacity:1;
    transform:scale(1) translateY(0);
}

h1{margin-bottom:15px;}
p{
    color:#555;
    margin-bottom:25px;
    line-height:1.6;
}

.btn{
    padding:10px 18px;
    background:#111;
    color:white;
    text-decoration:none;
    border-radius:6px;
    transition:.3s;
}

.btn:hover{
    background:#333;
}

/* GitHub Stats */
.gh-stats{
    margin-top:30px;
    padding-top:25px;
    border-top:1px solid #f0f0f0;
}

.stats-grid{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.stat-box{
    flex:1;
    min-width:80px;
    background:#f9f9f9;
    border-radius:8px;
    padding:12px;
    text-align:center;
}

.stat-box .num{
    font-size:22px;
    font-weight:700;
    color:#111;
}

.stat-box .label{
    font-size:11px;
    color:#888;
    margin-top:3px;
}

.stat-loading{
    background:#e5e7eb;
    border-radius:6px;
    height:14px;
    width:40px;
    margin:0 auto 4px;
    animation:pulse 1.4s infinite;
}

.contrib-wrap{
    margin-top:5px;
}

.contrib-wrap p{
    font-size:12px;
    color:#aaa;
    margin-bottom:8px;
    margin-top:0;
}

.contrib-wrap img{
    width:100%;
    border-radius:6px;
    filter: invert(0);
}
</style>
</head>

<body>

<div class="bg-skeleton" id="bgSkeleton"></div>
<div class="bg-image" id="bgImage"></div>

<div class="container">

<div id="contentSkeleton" class="skeleton">
    <div class="title"></div>
    <div class="text"></div>
    <div class="text"></div>
    <div class="text short"></div>
    <div class="btn-skel"></div>
</div>

<div id="realContent" class="content">
<h1>
<img src="https://raw.githubusercontent.com/Divya-Darshan/Divya-Darshan/refs/heads/main/gif/hi.gif"
height="40" style="vertical-align:middle;">
Hi, I'm Divya Darshan
</h1>

<p>
I'm a developer focused on building solutions.
I enjoy working with open-source tools and experimenting with systems.
Currently exploring opportunities to grow as a developer.
</p>

<a href="https://github.com/Divya-Darshan"
target="_blank"
class="btn">GitHub</a>

<!-- GitHub Stats Section -->
<div class="gh-stats">
    <div class="stats-grid">
        <div class="stat-box">
            <div class="num" id="stat-repos"><div class="stat-loading"></div></div>
            <div class="label">Repos</div>
        </div>
        <div class="stat-box">
            <div class="num" id="stat-stars"><div class="stat-loading"></div></div>
            <div class="label">Stars</div>
        </div>
        <div class="stat-box">
            <div class="num" id="stat-followers"><div class="stat-loading"></div></div>
            <div class="label">Followers</div>
        </div>
        <div class="stat-box">
            <div class="num" id="stat-following"><div class="stat-loading"></div></div>
            <div class="label">Following</div>
        </div>
    </div>

    <div class="contrib-wrap">
        <p>Contribution activity</p>
        <img src="https://ghchart.rshah.org/Divya-Darshan" alt="GitHub Contribution Chart">
    </div>
</div>

</div>
</div>

<script>

const img = new Image();
img.src="/img/start.png";

img.onload=()=>{
    document.getElementById("bgImage").classList.add("show");
    document.getElementById("bgSkeleton").style.opacity="0";
};

window.addEventListener("load",()=>{
    setTimeout(()=>{
        document.getElementById("contentSkeleton").classList.add("hide");
        document.getElementById("realContent").classList.add("show");
    },1000);
});

// Fetch GitHub stats
async function loadGitHubStats(){
    try {
        const res = await fetch("https://api.github.com/users/Divya-Darshan");
        const data = await res.json();

        document.getElementById("stat-repos").textContent = data.public_repos;
        document.getElementById("stat-followers").textContent = data.followers;
        document.getElementById("stat-following").textContent = data.following;

        // Fetch stars across all repos
        const reposRes = await fetch("https://api.github.com/users/Divya-Darshan/repos?per_page=100");
        const repos = await reposRes.json();
        const totalStars = repos.reduce((acc, r) => acc + r.stargazers_count, 0);
        document.getElementById("stat-stars").textContent = totalStars;

    } catch(e) {
        ["stat-repos","stat-stars","stat-followers","stat-following"]
            .forEach(id => document.getElementById(id).textContent = "-");
    }
}

loadGitHubStats();

</script>

</body>
</html>
